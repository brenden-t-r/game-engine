name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -DBACKEND_DIRECTX=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libglfw3-dev libglew-dev
      - name: Configure
        run: cmake -S . -B build -G "Ninja"
      - name: Build
        run: cmake --build build --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G "Ninja" -DBACKEND_METAL=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: build/

  generate-ios-xcodeproj:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure for iOS
        run: cmake -S . -B ios_build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DBACKEND_METAL=ON
      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodeproj
          path: ios_build/
